<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曼米中文 Mandamy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#FAF7F2;
      --surface:#FFFFFF;
      --ink:#2B2320;
      --ink-soft:#6B5F55;
      --seal:#E8825A;
      --seal-soft:#FBE8DE;
      --bamboo:#4C8577;
      --bamboo-soft:#E3F0EC;
      --border:rgba(43,35,32,0.08);
      --shadow:0 8px 32px -8px rgba(43,33,28,0.08);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --paper:#221C17;
        --surface:#2C2520;
        --ink:#F3ECE2;
        --ink-soft:#C6B9A8;
        --seal:#F0996A;
        --seal-soft:#3A2A20;
        --bamboo:#7FB0A0;
        --bamboo-soft:#33423C;
        --border:rgba(243,236,226,0.08);
        --shadow:0 8px 32px -8px rgba(0,0,0,0.5);
      }
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:"Public Sans","Noto Sans TC",-apple-system,sans-serif;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow-x:hidden;
    }

    /* 背景方格與裝飾紋理 */
    .bg-grid{
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size:36px 36px;
      pointer-events:none;
      z-index:0;
      mask-image:radial-gradient(ellipse at center, rgba(0,0,0,0.75) 20%, transparent 80%);
    }

    /* 主視覺容器 */
    .container{
      position:relative;
      z-index:1;
      max-width:760px;
      width:min(90%, 760px);
      margin:40px auto;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .logo-icon{
      width:112px;
      height:auto;
      margin-bottom:18px;
    }

    .brand-lockup{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:2px;
      margin:0 0 16px;
    }
    .brand-lockup .zh{
      font-family:"LXGW WenKai TC","Noto Serif TC",serif;
      font-size:clamp(34px, 6vw, 46px);
      letter-spacing:0.04em;
      font-weight:700;
      line-height:1.15;
    }
    .brand-lockup .en{
      font-family:"Public Sans",sans-serif;
      font-size:clamp(14px, 2vw, 16px);
      letter-spacing:0.18em;
      text-transform:uppercase;
      color:var(--bamboo);
      font-weight:600;
    }

    .badge{
      display:inline-block;
      font-size:12.5px;
      letter-spacing:0.08em;
      color:var(--bamboo);
      background:var(--bamboo-soft);
      padding:4px 14px;
      border-radius:99px;
      font-weight:600;
      margin-bottom:14px;
    }

    /* 進入按鈕 */
    .cta-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      background:var(--seal);
      color:#FFFFFF;
      text-decoration:none;
      font-size:16px;
      font-weight:600;
      padding:14px 38px;
      border-radius:12px;
      margin-top:16px;
      box-shadow:0 6px 20px -4px rgba(184,60,50,0.35);
      transition:background 0.15s ease, transform 0.12s ease;
    }
    .cta-btn:hover{
      filter:brightness(1.06);
      transform:translateY(-1px);
    }
    .cta-btn:active{
      transform:translateY(1px);
    }
    .arrow{
      font-size:18px;
      transition:transform 0.15s ease;
    }
    .cta-btn:hover .arrow{
      transform:translateX(4px);
    }

    footer{
      position:relative;
      z-index:1;
      margin-top:auto;
      padding:24px;
      font-size:12.5px;
      color:var(--ink-soft);
      letter-spacing:0.02em;
    }
  </style>
</head>
