<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注音教材 · 曼米中文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F2; --surface:#FFFFFF; --ink:#2B2320; --ink-soft:#6B5F55;
    --seal:#E8825A; --seal-soft:#FBE8DE; --bamboo:#4C8577; --bamboo-soft:#E3F0EC;
    --border:rgba(43,35,32,0.08); --line:rgba(43,35,32,0.16);
    --shadow:0 8px 32px -8px rgba(43,33,28,0.08);
    --fs:32px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#221C17; --surface:#2C2520; --ink:#F3ECE2; --ink-soft:#C6B9A8;
      --seal:#F0996A; --seal-soft:#3A2A20; --bamboo:#7FB0A0; --bamboo-soft:#33423C;
      --border:rgba(243,236,226,0.08); --line:rgba(243,236,226,0.2);
      --shadow:0 8px 32px -8px rgba(0,0,0,0.5);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans","Noto Sans TC",-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  button,select,input,textarea{font:inherit;color:inherit;}

  header.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);}
  .brand{font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-weight:700;font-size:20px;letter-spacing:.04em;}
  .brand small{font-family:"Public Sans",sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bamboo);margin-left:8px;font-weight:600;}
  .badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--seal-soft);color:var(--seal);letter-spacing:.06em;}
  .spacer{flex:1;}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;}
  .btn:hover{border-color:var(--bamboo);color:var(--bamboo);}
  .btn.primary{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:600;}
  .btn.primary:hover{filter:brightness(.95);color:#fff;}

  main{flex:1;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:20px;align-items:start;}
  @media (max-width:860px){main{grid-template-columns:1fr;}}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:12px;}
  @media (max-width:860px){.panel{position:static;}}
  .panel h2{margin:0;font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-size:17px;}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft);}
  input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);outline:none;}
  input[type=text]:focus,textarea:focus{border-color:var(--bamboo);}
  textarea{min-height:200px;resize:vertical;line-height:1.7;font-family:"Noto Sans TC",sans-serif;}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{flex:1;border:0;background:transparent;padding:8px 6px;cursor:pointer;font-size:13px;}
  .seg button+button{border-left:1px solid var(--line);}
  .seg button.on{background:var(--bamboo);color:#fff;}
  .row{display:flex;gap:10px;align-items:center;}
  input[type=range]{flex:1;accent-color:var(--seal);}
  .hint{font-size:12px;color:var(--ink-soft);line-height:1.6;margin:0;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3b82f6;vertical-align:middle;margin:0 3px;}

  .stage{overflow:auto;padding-bottom:40px;}
  .sheet{background:#fff;color:#1d1815;width:210mm;min-height:297mm;margin:0 auto;padding:18mm 16mm;box-shadow:var(--shadow);border-radius:4px;}
  .sheet.vertical{writing-mode:vertical-rl;height:297mm;min-height:0;overflow:visible;}
  .doc-title{font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-weight:700;font-size:calc(var(--fs)*1.15);text-align:center;margin:0 0 .8em;}
  .sheet.vertical .doc-title{margin:0 0 0 1em;text-align:start;}
  .body{white-space:pre-wrap;word-break:break-all;line-height:1.35;font-family:"Noto Sans TC","LXGW WenKai TC",sans-serif;font-size:var(--fs);}
  .body.kai{font-family:"LXGW WenKai TC","Noto Sans TC",sans-serif;}

  .zc{display:inline-flex;writing-mode:horizontal-tb;align-items:center;vertical-align:top;margin:5px 0;position:relative;}
  .zc .ch{line-height:1.15;}
  .zc .zy{display:inline-grid;grid-template-columns:auto auto;align-items:center;font-size:calc(var(--fs)*.42);line-height:1.05;margin-left:1px;cursor:default;font-family:"Noto Sans TC",sans-serif;}
  .zc .zs{display:flex;flex-direction:column;align-items:center;}
  .zc .tn{align-self:center;font-size:.9em;margin-left:1px;}
  .zc .tn.neutral{grid-column:1;grid-row:1;margin:0;line-height:.6;}
  .zc.poly .zy{cursor:pointer;border-radius:4px;}
  .zc.poly .zy:hover{background:var(--seal-soft);}
  .zc.poly:not(.noedit)::after{content:"";position:absolute;right:calc(var(--fs)*.12);bottom:-3px;width:5px;height:5px;border-radius:50%;background:#3b82f6;}
  .zc.hide-ch .ch{visibility:hidden;}
  .zc.hide-zy .zy{visibility:hidden;}
  .zc.trace .ch{color:#c9c2b8;}

  /* 生字簿格線 */
  .grid .zc{border:1px solid #b9ada0;margin:-.5px;padding:3px 4px;width:calc(var(--fs)*1.9);height:calc(var(--fs)*1.45);justify-content:center;background:
    linear-gradient(to right,transparent calc(50% - .5px),rgba(185,173,160,.55) calc(50% - .5px),rgba(185,173,160,.55) calc(50% + .5px),transparent calc(50% + .5px)),
    linear-gradient(to bottom,transparent calc(50% - .5px),rgba(185,173,160,.55) calc(50% - .5px),rgba(185,173,160,.55) calc(50% + .5px),transparent calc(50% + .5px));}
  .grid .zc .ch{background:transparent;}

  .popup{position:fixed;z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px -6px rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column;min-width:110px;}
  .popup button{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;text-align:left;font-size:15px;font-family:"Noto Sans TC",sans-serif;}
  .popup button:hover,.popup button.cur{background:var(--bamboo-soft);color:var(--bamboo);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:.95;}

  @media print{
    @page{size:A4;margin:0;}
    body{background:#fff;display:block;}
    header.top,.panel,.popup,.toast{display:none!important;}
    main{display:block;padding:0;}
    .stage{overflow:visible;padding:0;}
    .sheet{box-shadow:none;border-radius:0;margin:0;}
    .zc.poly::after{display:none!important;}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">曼米中文<small>Zhuyin</small></div>
  <span class="badge">注音教材 · 試做版</span>
  <div class="spacer"></div>
  <button class="btn" id="btnSample">範例文字</button>
  <button class="btn primary" id="btnPrint">列印 / 存成 PDF</button>
</header>

<main>
  <section class="panel">
    <h2>編輯教材</h2>
    <label class="f">標題（可留空）
      <input type="text" id="title" placeholder="例：第三課　小熊的禮物">
    </label>
    <label class="f">內容（貼上或直接打字，注音會自動標好）
      <textarea id="text" placeholder="在這裡輸入國字…"></textarea>
    </label>

    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft)">排版方向
      <div class="seg" data-key="dir">
        <button data-v="h" class="on">橫書</button><button data-v="v">直書</button>
      </div>
    </div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft)">版面
      <div class="seg" data-key="layout">
        <button data-v="flow" class="on">一般文章</button><button data-v="grid">生字簿格線</button>
      </div>
    </div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft)">練習模式（給學生填寫）
      <div class="seg" data-key="mode">
        <button data-v="none" class="on">完整</button><button data-v="ch">隱國字</button><button data-v="zy">隱注音</button><button data-v="trace">描寫</button>
      </div>
    </div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft)">字體
      <div class="seg" data-key="font">
        <button data-v="sans" class="on">黑體</button><button data-v="kai">楷體</button>
      </div>
    </div>
    <label class="f">字級
      <div class="row"><input type="range" id="fs" min="20" max="56" value="32"><span id="fsv">32</span></div>
    </label>
    <p class="hint">破音字下方有 <span class="dot"></span> 藍點，點注音即可換讀音。<br>此為試做版：單頁預覽，尚未分頁。</p>
  </section>

  <section class="stage">
    <article class="sheet" id="sheet">
      <h1 class="doc-title" id="docTitle"></h1>
      <div class="body" id="out"></div>
    </article>
  </section>
</main>
<div class="toast" id="toast"></div>

<script src="vendor/pinyin-pro.js"></script>
<script>
(function(){
  if(typeof pinyinPro !== "undefined" && typeof pinyinPro.customPinyin === "function"){
    pinyinPro.customPinyin({ "妳": "nǐ" });
  }

  /* ---------- 拼音 → 注音 ---------- */
  var INIT = {b:"ㄅ",p:"ㄆ",m:"ㄇ",f:"ㄈ",d:"ㄉ",t:"ㄊ",n:"ㄋ",l:"ㄌ",g:"ㄍ",k:"ㄎ",h:"ㄏ",j:"ㄐ",q:"ㄑ",x:"ㄒ",zh:"ㄓ",ch:"ㄔ",sh:"ㄕ",r:"ㄖ",z:"ㄗ",c:"ㄘ",s:"ㄙ"};
  var FIN = {a:"ㄚ",o:"ㄛ",e:"ㄜ","ê":"ㄝ",ai:"ㄞ",ei:"ㄟ",ao:"ㄠ",ou:"ㄡ",an:"ㄢ",en:"ㄣ",ang:"ㄤ",eng:"ㄥ",er:"ㄦ",
    i:"ㄧ",ia:"ㄧㄚ",io:"ㄧㄛ",ie:"ㄧㄝ",iao:"ㄧㄠ",iu:"ㄧㄡ",iou:"ㄧㄡ",ian:"ㄧㄢ",in:"ㄧㄣ",iang:"ㄧㄤ",ing:"ㄧㄥ",
    u:"ㄨ",ua:"ㄨㄚ",uo:"ㄨㄛ",uai:"ㄨㄞ",ui:"ㄨㄟ",uei:"ㄨㄟ",uan:"ㄨㄢ",un:"ㄨㄣ",uen:"ㄨㄣ",uang:"ㄨㄤ",ong:"ㄨㄥ",ueng:"ㄨㄥ",
    "ü":"ㄩ","üe":"ㄩㄝ","üan":"ㄩㄢ","ün":"ㄩㄣ",iong:"ㄩㄥ"};
  var TONE = {"0":"˙","1":"","2":"ˊ","3":"ˇ","4":"ˋ","5":"˙"};

  // 回傳 {s:"ㄗㄞ", t:"ˋ"}；失敗回 null
  function toZhuyin(py){
    var m = /^([a-zêüv]+)([0-5]?)$/.exec(String(py).toLowerCase().replace(/ü/g,"ü"));
    if(!m) return null;
    var s = m[1].replace(/v/g,"ü"), tone = m[2] || "5", ini = "", fin = s;
    if(s === "yu"|| /^yu/.test(s)) fin = "ü" + s.slice(2);
    else if(/^y/.test(s)) fin = /^i/.test(s.slice(1)) ? s.slice(1) : "i" + s.slice(1);
    else if(/^w/.test(s)) fin = /^u/.test(s.slice(1)) ? s.slice(1) : "u" + s.slice(1);
    else {
      var two = s.slice(0,2);
      if(INIT[two]) { ini = two; fin = s.slice(2); }
      else if(INIT[s[0]]) { ini = s[0]; fin = s.slice(1); }
      if(/^[jqx]$/.test(ini)) fin = fin.replace(/^u/,"ü");
      if(/^(zh|ch|sh|r|z|c|s)$/.test(ini) && fin === "i") fin = "";
    }
    if(fin === "" && ini === "") return null;
    var z = (INIT[ini] || "") + (fin === "" ? "" : (FIN[fin] || null));
    if(z.indexOf("null") >= 0) return null;
    return { s: z, t: TONE[tone] };
  }
  function keyOf(z){ return z.s + z.t; }

  /* ---------- 狀態 ---------- */
  var S = { dir:"h", layout:"flow", mode:"none", font:"sans" };
  var overrides = {};          // 字元位置 → {c, z}
  var $ = function(id){ return document.getElementById(id); };
  var HAN = /[㐀-鿿豈-﫿]/;

  function analyse(text){
    var chars = Array.from(text), n = chars.length, res = new Array(n);
    var hanText = chars.join("");
    var seq = [], poly = null, pyArr = [];
    try {
      pyArr = pinyinPro.pinyin(hanText, { toneType:"num", type:"array", v:true });
      poly = (typeof pinyinPro.polyphonic === "function") ? pinyinPro.polyphonic(hanText, { toneType:"num", type:"array", v:true }) : null;
    } catch(e){ pyArr = []; }
    // pinyin-pro 對非漢字也會各佔一格，長度與 chars 對齊
    for(var i=0;i<n;i++){
      var c = chars[i];
      if(!HAN.test(c)){ res[i] = { c:c }; continue; }
      var cur = toZhuyin(pyArr[i] || "");
      var alts = [];
      if(poly && poly[i] && poly[i].length > 1){
        poly[i].forEach(function(p){ var z = toZhuyin(p); if(z && !alts.some(function(a){return keyOf(a)===keyOf(z);})) alts.push(z); });
      }
      if(cur && alts.length && !alts.some(function(a){return keyOf(a)===keyOf(cur);})) alts.unshift(cur);
      var o = overrides[i];
      if(o && o.c === c) cur = o.z; else delete overrides[i];
      res[i] = { c:c, z:cur, alts: alts.length > 1 ? alts : null };
    }
    return res;
  }

  function esc(s){ return s.replace(/[&<>"]/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }

  function render(){
    var text = $("text").value;
    var data = analyse(text), html = "";
    data.forEach(function(d, i){
      if(!d.z && !HAN.test(d.c)){ html += (S.layout === "grid" && !/\s/.test(d.c)) ? '<span class="zc"><span class="ch">'+esc(d.c)+'</span></span>' : esc(d.c); return; }
      var cls = "zc";
      if(d.alts) cls += " poly";
      if(S.mode === "ch") cls += " hide-ch";
      if(S.mode === "zy") cls += " hide-zy";
      if(S.mode === "trace") cls += " trace";
      var zy = "";
      if(d.z){
        var sym = Array.from(d.z.s).map(function(x){ return "<span>"+x+"</span>"; }).join("");
        var tone = d.z.t === "˙" ? '<span class="tn neutral">˙</span>' : (d.z.t ? '<span class="tn">'+d.z.t+"</span>" : "");
        zy = '<span class="zy" data-i="'+i+'"><span class="zs">'+(d.z.t === "˙" ? '<span class="tn neutral" style="margin:0">˙</span>' : "")+sym+"</span>"+(d.z.t && d.z.t !== "˙" ? tone : "")+"</span>";
      }
      html += '<span class="'+cls+'"><span class="ch">'+esc(d.c)+"</span>"+zy+"</span>";
    });
    $("out").innerHTML = html;
    $("out")._data = data;
    var t = $("title").value.trim();
    $("docTitle").textContent = t;
    $("docTitle").style.display = t ? "" : "none";
    persist();
  }

  function applyView(){
    $("sheet").classList.toggle("vertical", S.dir === "v");
    $("out").classList.toggle("grid", S.layout === "grid");
    $("out").classList.toggle("kai", S.font === "kai");
    $("sheet").classList.toggle("grid", S.layout === "grid");
    document.querySelectorAll(".seg").forEach(function(seg){
      var k = seg.dataset.key;
      seg.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === S[k]); });
    });
    $("sheet").style.setProperty("--fs", $("fs").value + "px");
    document.documentElement.style.setProperty("--fs", $("fs").value + "px");
    $("fsv").textContent = $("fs").value;
  }

  /* ---------- 破音字選單 ---------- */
  var popup = null;
  function closePopup(){ if(popup){ popup.remove(); popup = null; } }
  $("out").addEventListener("click", function(e){
    var zy = e.target.closest(".zy"); if(!zy) return;
    var i = +zy.dataset.i, d = $("out")._data[i];
    if(!d || !d.alts) return;
    e.stopPropagation(); closePopup();
    popup = document.createElement("div"); popup.className = "popup";
    d.alts.forEach(function(a){
      var b = document.createElement("button");
      b.textContent = d.c + "　" + a.s + a.t;
      if(keyOf(a) === keyOf(d.z)) b.className = "cur";
      b.onclick = function(){ overrides[i] = { c:d.c, z:a }; closePopup(); render(); };
      popup.appendChild(b);
    });
    document.body.appendChild(popup);
    var r = zy.getBoundingClientRect();
    popup.style.left = Math.min(r.left, innerWidth - 150) + "px";
    popup.style.top = Math.min(r.bottom + 6, innerHeight - popup.offsetHeight - 10) + "px";
  });
  document.addEventListener("click", closePopup);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closePopup(); });

  /* ---------- 控制項 ---------- */
  document.querySelectorAll(".seg").forEach(function(seg){
    seg.addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return;
      S[seg.dataset.key] = b.dataset.v; applyView(); render();
    });
  });
  $("fs").addEventListener("input", function(){ applyView(); persist(); });
  var timer; function later(){ clearTimeout(timer); timer = setTimeout(render, 120); }
  $("text").addEventListener("input", later);
  $("title").addEventListener("input", later);
  $("btnPrint").onclick = function(){ closePopup(); window.print(); };
  $("btnSample").onclick = function(){
    $("title").value = "小熊的禮物";
    $("text").value = "媽媽說今天是小熊的生日，大家都很開心。\n小熊的朋友為他準備了一份驚喜：有蛋糕，也有好多好玩的遊戲。\n長頸鹿說：「祝你生日快樂！」小熊的心裡好溫暖。";
    overrides = {}; render(); toast("已放入範例文字");
  };
  function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); }, 1600); }

  /* ---------- 暫存（存在這台瀏覽器） ---------- */
  var KEY = "mandamy-zhuyin-draft";
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify({ title:$("title").value, text:$("text").value, S:S, fs:$("fs").value, overrides:overrides })); } catch(e){}
  }
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if(saved){ $("title").value = saved.title || ""; $("text").value = saved.text || ""; Object.assign(S, saved.S || {}); $("fs").value = saved.fs || 32; overrides = saved.overrides || {}; }
  } catch(e){}
  if(!$("text").value) $("btnSample").click();
  applyView(); render();
})();
</script>
</body>
</html>
