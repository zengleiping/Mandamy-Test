<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注音教材 · 曼米中文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F2; --surface:#FFFFFF; --ink:#2B2320; --ink-soft:#6B5F55;
    --seal:#E8825A; --seal-soft:#FBE8DE; --bamboo:#4C8577; --bamboo-soft:#E3F0EC;
    --border:rgba(43,35,32,0.08); --line:rgba(43,35,32,0.16);
    --shadow:0 8px 32px -8px rgba(43,33,28,0.08);
    --fs:32px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#221C17; --surface:#2C2520; --ink:#F3ECE2; --ink-soft:#C6B9A8;
      --seal:#F0996A; --seal-soft:#3A2A20; --bamboo:#7FB0A0; --bamboo-soft:#33423C;
      --border:rgba(243,236,226,0.08); --line:rgba(243,236,226,0.2);
      --shadow:0 8px 32px -8px rgba(0,0,0,0.5);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans","Noto Sans TC",-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  button,select,input,textarea{font:inherit;color:inherit;}

  header.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);}
  .brand{font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-weight:700;font-size:20px;letter-spacing:.04em;}
  .brand small{font-family:"Public Sans",sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bamboo);margin-left:8px;font-weight:600;}
  .badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--seal-soft);color:var(--seal);letter-spacing:.06em;}
  .spacer{flex:1;}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;}
  .btn:hover{border-color:var(--bamboo);color:var(--bamboo);}
  .btn.primary{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:600;}
  .btn.primary:hover{filter:brightness(.95);color:#fff;}

  main{flex:1;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:20px;align-items:start;}
  @media (max-width:860px){main{grid-template-columns:1fr;}}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:12px;}
  @media (max-width:860px){.panel{position:static;}}
  .panel h2{margin:0;font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-size:17px;}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft);}
  input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);outline:none;}
  input[type=text]:focus,textarea:focus{border-color:var(--bamboo);}
  textarea{min-height:200px;resize:vertical;line-height:1.7;font-family:"Noto Sans TC",sans-serif;}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{flex:1;border:0;background:transparent;padding:8px 6px;cursor:pointer;font-size:13px;}
  .seg button+button{border-left:1px solid var(--line);}
  .seg button.on{background:var(--bamboo);color:#fff;}
  .row{display:flex;gap:10px;align-items:center;}
  input[type=range]{flex:1;accent-color:var(--seal);}
  .hint{font-size:12px;color:var(--ink-soft);line-height:1.6;margin:0;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3b82f6;vertical-align:middle;margin:0 3px;}

  .stage{overflow:auto;padding-bottom:40px;}
  #pages{display:flex;flex-direction:column;align-items:center;gap:18px;transform-origin:top center;}
  .page{background:#fff;color:#1d1815;width:210mm;height:297mm;flex:none;padding:18mm 16mm;box-shadow:var(--shadow);border-radius:4px;display:flex;flex-direction:column;position:relative;}
  .page.vertical{flex-direction:row-reverse;}
  .page .pno{position:absolute;bottom:7mm;left:0;right:0;text-align:center;font-size:11px;color:#9a8f84;font-family:"Public Sans",sans-serif;}
  .doc-title{font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-weight:700;font-size:calc(var(--fs)*1.15);text-align:center;margin:0 0 .8em;flex:none;}
  .page.vertical .doc-title{writing-mode:vertical-rl;margin:0 0 0 1em;text-align:start;}
  .pbody{flex:1;min-width:0;min-height:0;overflow:hidden;white-space:pre-wrap;word-break:break-all;line-height:1.35;font-family:"Noto Sans TC","LXGW WenKai TC",sans-serif;font-size:var(--fs);}
  .page.vertical .pbody{writing-mode:vertical-rl;}
  .pbody.kai{font-family:"LXGW WenKai TC","Noto Sans TC",sans-serif;}
  .pt{display:inline;}

  .zc{display:inline-flex;writing-mode:horizontal-tb;align-items:center;vertical-align:top;margin:5px 0;position:relative;}
  .zc .ch{line-height:1.15;}
  .zc .zy{display:inline-grid;grid-template-columns:auto auto;align-items:center;font-size:calc(var(--fs)*.42);line-height:1.05;margin-left:1px;cursor:default;font-family:"Noto Sans TC",sans-serif;}
  .zc .zs{display:flex;flex-direction:column;align-items:center;}
  .zc .tn{align-self:center;font-size:.9em;margin-left:1px;}
  .zc .tn.neutral{grid-column:1;grid-row:1;margin:0;line-height:.6;}
  .zc.poly .zy{cursor:pointer;border-radius:4px;}
  .zc.poly .zy:hover{background:var(--seal-soft);}
  .zc.poly:not(.noedit)::after{content:"";position:absolute;right:calc(var(--fs)*.12);bottom:-3px;width:5px;height:5px;border-radius:50%;background:#3b82f6;}
  .zc.hide-ch .ch{visibility:hidden;}
  .zc.hide-zy .zy{visibility:hidden;}
  .zc.trace .ch{color:#c9c2b8;}

  /* 生字簿格線 */
  .pbody.grid .zc{border:1px solid #b9ada0;margin:-.5px;padding:3px 4px;width:calc(var(--fs)*1.9);height:calc(var(--fs)*1.45);justify-content:center;background:
    linear-gradient(to right,transparent calc(50% - .5px),rgba(185,173,160,.55) calc(50% - .5px),rgba(185,173,160,.55) calc(50% + .5px),transparent calc(50% + .5px)),
    linear-gradient(to bottom,transparent calc(50% - .5px),rgba(185,173,160,.55) calc(50% - .5px),rgba(185,173,160,.55) calc(50% + .5px),transparent calc(50% + .5px));}

  /* 學生作答 */
  .ans{font-family:"Noto Sans TC","LXGW WenKai TC",sans-serif;border:0;border-bottom:2px dashed var(--seal);background:#fff8f2;text-align:center;outline:none;border-radius:4px 4px 0 0;padding:0;color:#1d1815;}
  .ans.ch{width:calc(var(--fs)*1.15);height:calc(var(--fs)*1.15);font-size:var(--fs);}
  .ans.zin{width:calc(var(--fs)*1.0);height:calc(var(--fs)*1.0);font-size:calc(var(--fs)*.42);margin-left:2px;}
  .ans:focus{background:#fff1e6;border-bottom-color:var(--bamboo);}
  .ans.ok{background:#e3f0ec;border-bottom:2px solid #4C8577;}
  .ans.bad{background:#fde8e6;border-bottom:2px solid #d9534f;}
  body.student .panel,body.student .teacher-only{display:none!important;}
  body:not(.student) .student-only{display:none!important;}
  body.student main{grid-template-columns:1fr;}
  .student-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .student-bar input{width:140px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);}
  .score{font-weight:700;color:var(--bamboo);}
  dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:20px;width:min(560px,92vw);box-shadow:0 20px 50px -10px rgba(0,0,0,.35);}
  dialog::backdrop{background:rgba(34,28,23,.45);}
  dialog h2{margin:0 0 12px;font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-size:18px;}
  .lib-row{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--border);}
  .lib-row .t{flex:1;min-width:0;}
  .lib-row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lib-row .t small{color:var(--ink-soft);font-size:12px;}
  .lib-row .btn{padding:5px 10px;font-size:13px;}
  .lib-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .popup{position:fixed;z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px -6px rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column;min-width:110px;}
  .popup button{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;text-align:left;font-size:15px;font-family:"Noto Sans TC",sans-serif;}
  .popup button:hover,.popup button.cur{background:var(--bamboo-soft);color:var(--bamboo);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:.95;}

  @media print{
    @page{size:A4;margin:0;}
    body{background:#fff;display:block;}
    header.top,.panel,.popup,.toast{display:none!important;}
    main{display:block;padding:0;}
    .stage{overflow:visible;padding:0;}
    #pages{display:block;zoom:1!important;gap:0;}
    .page{box-shadow:none;border-radius:0;margin:0;break-after:page;page-break-after:always;}
    .page:last-child{break-after:auto;page-break-after:auto;}
    .student-bar,dialog{display:none!important;}
    .ans{border-bottom-color:#999;background:transparent;}
    .zc.poly::after{display:none!important;}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">曼米中文<small>Zhuyin</small></div>
  <span class="badge">注音教材 · 試做版</span>
  <div class="spacer"></div>
  <button class="btn teacher-only" id="btnLib">我的教材</button>
  <button class="btn teacher-only" id="btnSample">範例文字</button>
  <button class="btn teacher-only" id="btnPreview">預覽學生版</button>
  <button class="btn teacher-only" id="btnLink">複製學生連結</button>
  <div class="student-bar student-only">
    <input id="stuName" placeholder="姓名">
    <button class="btn primary" id="btnCheck">檢查答案</button>
    <button class="btn" id="btnReset">重做</button>
    <button class="btn" id="btnCopyScore">複製成績</button>
    <span class="score" id="score"></span>
  </div>
  <button class="btn primary" id="btnPrint">列印 / 存成 PDF</button>
</header>

<main>
  <section class="panel">
    <h2>編輯教材</h2>
    <label class="f">標題（可留空）
      <input type="text" id="title" placeholder="例：第三課　小熊的禮物">
    </label>
    <label class="f">內容（貼上或直接打字，注音會自動標好）
      <textarea id="text" placeholder="在這裡輸入國字…"></textarea>
    </label>

    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft)">排版方向
      <div class="seg" data-key="dir">
        <button data-v="h" class="on">橫書</button><button data-v="v">直書</button>
      </div>
    </div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft)">版面
      <div class="seg" data-key="layout">
        <button data-v="flow" class="on">一般文章</button><button data-v="grid">生字簿格線</button>
      </div>
    </div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft)">練習模式（給學生填寫）
      <div class="seg" data-key="mode">
        <button data-v="none" class="on">完整</button><button data-v="ch">隱國字</button><button data-v="zy">隱注音</button><button data-v="trace">描寫</button>
      </div>
    </div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft)">字體
      <div class="seg" data-key="font">
        <button data-v="sans" class="on">黑體</button><button data-v="kai">楷體</button>
      </div>
    </div>
    <label class="f">字級
      <div class="row"><input type="range" id="fs" min="20" max="56" value="32"><span id="fsv">32</span></div>
    </label>
    <p class="hint">破音字下方有 <span class="dot"></span> 藍點，點注音即可換讀音。<br>文章太長會自動接到下一頁。要給學生作答：選「隱國字」或「隱注音」，再按上方「複製學生連結」。</p>
  </section>

  <section class="stage"><div id="pages"></div></section>
</main>
<dialog id="libDlg">
  <h2>我的教材</h2>
  <div class="lib-tools">
    <button class="btn primary" id="libSave">儲存目前這份</button>
    <button class="btn" id="libSaveAs">另存新檔</button>
    <button class="btn" id="libNew">新增空白</button>
    <button class="btn" id="libExport">匯出備份</button>
    <label class="btn" style="margin:0">匯入備份<input type="file" id="libImport" accept=".json" hidden></label>
  </div>
  <div id="libList"></div>
  <p class="hint" style="margin-top:12px">教材目前存在這台瀏覽器；接上曼米平台後會改存雲端教材庫。</p>
  <div style="text-align:right;margin-top:8px"><button class="btn" id="libClose">關閉</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script src="vendor/pinyin-pro.js"></script>
<script>
(function(){
  if(typeof pinyinPro !== "undefined" && typeof pinyinPro.customPinyin === "function"){
    pinyinPro.customPinyin({ "妳": "nǐ" });
  }

  /* ---------- 拼音 → 注音 ---------- */
  var INIT = {b:"ㄅ",p:"ㄆ",m:"ㄇ",f:"ㄈ",d:"ㄉ",t:"ㄊ",n:"ㄋ",l:"ㄌ",g:"ㄍ",k:"ㄎ",h:"ㄏ",j:"ㄐ",q:"ㄑ",x:"ㄒ",zh:"ㄓ",ch:"ㄔ",sh:"ㄕ",r:"ㄖ",z:"ㄗ",c:"ㄘ",s:"ㄙ"};
  var FIN = {a:"ㄚ",o:"ㄛ",e:"ㄜ","ê":"ㄝ",ai:"ㄞ",ei:"ㄟ",ao:"ㄠ",ou:"ㄡ",an:"ㄢ",en:"ㄣ",ang:"ㄤ",eng:"ㄥ",er:"ㄦ",
    i:"ㄧ",ia:"ㄧㄚ",io:"ㄧㄛ",ie:"ㄧㄝ",iao:"ㄧㄠ",iu:"ㄧㄡ",iou:"ㄧㄡ",ian:"ㄧㄢ",in:"ㄧㄣ",iang:"ㄧㄤ",ing:"ㄧㄥ",
    u:"ㄨ",ua:"ㄨㄚ",uo:"ㄨㄛ",uai:"ㄨㄞ",ui:"ㄨㄟ",uei:"ㄨㄟ",uan:"ㄨㄢ",un:"ㄨㄣ",uen:"ㄨㄣ",uang:"ㄨㄤ",ong:"ㄨㄥ",ueng:"ㄨㄥ",
    "ü":"ㄩ","üe":"ㄩㄝ","üan":"ㄩㄢ","ün":"ㄩㄣ",iong:"ㄩㄥ"};
  var TONE = {"0":"˙","1":"","2":"ˊ","3":"ˇ","4":"ˋ","5":"˙"};

  // 回傳 {s:"ㄗㄞ", t:"ˋ"}；失敗回 null
  function toZhuyin(py){
    var m = /^([a-zêüv]+)([0-5]?)$/.exec(String(py).toLowerCase().replace(/ü/g,"ü"));
    if(!m) return null;
    var s = m[1].replace(/v/g,"ü"), tone = m[2] || "5", ini = "", fin = s;
    if(s === "yu"|| /^yu/.test(s)) fin = "ü" + s.slice(2);
    else if(/^y/.test(s)) fin = /^i/.test(s.slice(1)) ? s.slice(1) : "i" + s.slice(1);
    else if(/^w/.test(s)) fin = /^u/.test(s.slice(1)) ? s.slice(1) : "u" + s.slice(1);
    else {
      var two = s.slice(0,2);
      if(INIT[two]) { ini = two; fin = s.slice(2); }
      else if(INIT[s[0]]) { ini = s[0]; fin = s.slice(1); }
      if(/^[jqx]$/.test(ini)) fin = fin.replace(/^u/,"ü");
      if(/^(zh|ch|sh|r|z|c|s)$/.test(ini) && fin === "i") fin = "";
    }
    if(fin === "" && ini === "") return null;
    var z = (INIT[ini] || "") + (fin === "" ? "" : (FIN[fin] || null));
    if(z.indexOf("null") >= 0) return null;
    return { s: z, t: TONE[tone] };
  }
  function keyOf(z){ return z.s + z.t; }

  /* ---------- 狀態 ---------- */
  var S = { dir:"h", layout:"flow", mode:"none", font:"sans" };
  var overrides = {};          // 字元位置 → {c, z}
  var docId = null;            // 目前教材在「我的教材」裡的 id
  var STUDENT = false;
  var $ = function(id){ return document.getElementById(id); };
  var HAN = /[㐀-鿿豈-﫿]/;

  function analyse(text){
    var chars = Array.from(text), n = chars.length, res = new Array(n);
    var hanText = chars.join("");
    var poly = null, pyArr = [];
    try {
      pyArr = pinyinPro.pinyin(hanText, { toneType:"num", type:"array", v:true });
      poly = (typeof pinyinPro.polyphonic === "function") ? pinyinPro.polyphonic(hanText, { toneType:"num", type:"array", v:true }) : null;
    } catch(e){ pyArr = []; }
    for(var i=0;i<n;i++){
      var c = chars[i];
      if(!HAN.test(c)){ res[i] = { c:c }; continue; }
      var cur = toZhuyin(pyArr[i] || "");
      var alts = [];
      if(poly && poly[i] && poly[i].length > 1){
        poly[i].forEach(function(p){ var z = toZhuyin(p); if(z && !alts.some(function(a){return keyOf(a)===keyOf(z);})) alts.push(z); });
      }
      if(cur && alts.length && !alts.some(function(a){return keyOf(a)===keyOf(cur);})) alts.unshift(cur);
      var o = overrides[i];
      if(o && o.c === c) cur = o.z; else delete overrides[i];
      res[i] = { c:c, z:cur, alts: alts.length > 1 ? alts : null };
    }
    return res;
  }

  function esc(s){ return s.replace(/[&<>"]/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }

  /* 把一個字做成 HTML；學生版的隱藏欄位換成輸入框 */
  function cellHtml(d, i){
    if(!d.z && !HAN.test(d.c)){
      return (S.layout === "grid") ? '<span class="zc"><span class="ch">'+esc(d.c)+'</span></span>' : '<span class="pt">'+esc(d.c)+'</span>';
    }
    var cls = "zc";
    if(d.alts && !STUDENT) cls += " poly";
    var hideCh = S.mode === "ch", hideZy = S.mode === "zy";
    if(!STUDENT){ if(hideCh) cls += " hide-ch"; if(hideZy) cls += " hide-zy"; }
    if(S.mode === "trace") cls += " trace";
    var chHtml = '<span class="ch">'+esc(d.c)+"</span>", zy = "";
    if(STUDENT && hideCh) chHtml = '<input class="ans ch" data-a="'+esc(d.c)+'" autocomplete="off" aria-label="填國字">';
    if(d.z && STUDENT && hideZy){
      zy = '<input class="ans zin" data-a="'+esc(d.z.s + d.z.t)+'" autocomplete="off" aria-label="填注音">';
    } else if(d.z){
      var sym = Array.from(d.z.s).map(function(x){ return "<span>"+x+"</span>"; }).join("");
      var neutral = d.z.t === "˙";
      zy = '<span class="zy" data-i="'+i+'"><span class="zs">'+(neutral ? '<span class="tn neutral" style="margin:0">˙</span>' : "")+sym+"</span>"+(d.z.t && !neutral ? '<span class="tn">'+d.z.t+"</span>" : "")+"</span>";
    }
    return '<span class="'+cls+'">'+chHtml+zy+"</span>";
  }

  /* ---------- 分頁 ---------- */
  function paginate(items, title){
    var host = $("pages");
    host.innerHTML = ""; host.style.zoom = 1;
    var pageNo = 0, body = null, count = 0;
    function newPage(){
      pageNo++;
      var pg = document.createElement("article");
      pg.className = "page" + (S.dir === "v" ? " vertical" : "");
      if(pageNo === 1 && title){ var h = document.createElement("h1"); h.className = "doc-title"; h.textContent = title; pg.appendChild(h); }
      body = document.createElement("div");
      body.className = "pbody" + (S.layout === "grid" ? " grid" : "") + (S.font === "kai" ? " kai" : "");
      pg.appendChild(body);
      var no = document.createElement("div"); no.className = "pno"; no.textContent = pageNo; pg.appendChild(no);
      host.appendChild(pg); count = 0;
    }
    function overflows(el){
      var b = body.getBoundingClientRect(), r = el.getBoundingClientRect();
      return S.dir === "v" ? r.left < b.left - 1 : r.bottom > b.bottom + 1;
    }
    newPage();
    items.forEach(function(it){
      if(it === "\n"){ if(count) body.appendChild(document.createTextNode("\n")); return; }
      body.insertAdjacentHTML("beforeend", it);
      count++;
      var el = body.lastElementChild;
      if(count > 1 && overflows(el)){
        body.removeChild(el);
        newPage();
        body.insertAdjacentHTML("beforeend", it); count = 1;
      }
    });
    // 頁數 > 1 時才顯示頁碼
    if(pageNo === 1) host.querySelector(".pno").style.display = "none";
    fitZoom();
  }
  function fitZoom(){
    var host = $("pages"), avail = host.parentNode.clientWidth - 8, need = 794;
    host.style.zoom = avail < need ? Math.max(.3, avail / need) : 1;
  }
  window.addEventListener("resize", fitZoom);

  function render(){
    var data = analyse($("text").value), items = [];
    data.forEach(function(d, i){ items.push(d.c === "\n" ? "\n" : (/\s/.test(d.c) && !HAN.test(d.c) ? '<span class="pt">'+esc(d.c)+'</span>' : cellHtml(d, i))); });
    paginate(items, $("title").value.trim());
    $("pages")._data = data;
    if(!STUDENT) persist();
  }

  function applyView(){
    document.querySelectorAll(".seg").forEach(function(seg){
      var k = seg.dataset.key;
      seg.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === S[k]); });
    });
    document.documentElement.style.setProperty("--fs", $("fs").value + "px");
    $("fsv").textContent = $("fs").value;
  }

  /* ---------- 破音字選單 ---------- */
  var popup = null;
  function closePopup(){ if(popup){ popup.remove(); popup = null; } }
  $("pages").addEventListener("click", function(e){
    if(STUDENT) return;
    var zy = e.target.closest(".zy"); if(!zy) return;
    var i = +zy.dataset.i, d = $("pages")._data[i];
    if(!d || !d.alts) return;
    e.stopPropagation(); closePopup();
    popup = document.createElement("div"); popup.className = "popup";
    d.alts.forEach(function(a){
      var b = document.createElement("button");
      b.textContent = d.c + "　" + a.s + a.t;
      if(keyOf(a) === keyOf(d.z)) b.className = "cur";
      b.onclick = function(){ overrides[i] = { c:d.c, z:a }; closePopup(); render(); };
      popup.appendChild(b);
    });
    document.body.appendChild(popup);
    var r = zy.getBoundingClientRect();
    popup.style.left = Math.min(r.left, innerWidth - 150) + "px";
    popup.style.top = Math.min(r.bottom + 6, innerHeight - popup.offsetHeight - 10) + "px";
  });
  document.addEventListener("click", closePopup);
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closePopup();
    if((e.ctrlKey || e.metaKey) && e.key === "s" && !STUDENT){ e.preventDefault(); saveDoc(false); }
  });

  /* ---------- 控制項 ---------- */
  document.querySelectorAll(".seg").forEach(function(seg){
    seg.addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return;
      S[seg.dataset.key] = b.dataset.v; applyView(); render();
    });
  });
  var timer; function later(){ clearTimeout(timer); timer = setTimeout(render, 150); }
  $("fs").addEventListener("input", function(){ applyView(); later(); });
  $("text").addEventListener("input", later);
  $("title").addEventListener("input", later);
  $("btnPrint").onclick = function(){ closePopup(); window.print(); };
  $("btnSample").onclick = function(){
    docId = null;
    $("title").value = "小熊的禮物";
    $("text").value = "媽媽說今天是小熊的生日，大家都很開心。\n小熊的朋友為他準備了一份驚喜：有蛋糕，也有好多好玩的遊戲。\n長頸鹿說：「祝你生日快樂！」小熊的心裡好溫暖。";
    overrides = {}; render(); toast("已放入範例文字");
  };
  function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); }, 1800); }

  /* ---------- 教材資料 ---------- */
  function snapshot(){ return { title:$("title").value, text:$("text").value, S:Object.assign({}, S), fs:+$("fs").value, overrides:overrides }; }
  function loadSnapshot(d){
    $("title").value = d.title || ""; $("text").value = d.text || "";
    S = Object.assign({ dir:"h", layout:"flow", mode:"none", font:"sans" }, d.S || {});
    $("fs").value = d.fs || 32; overrides = d.overrides || {};
    applyView(); render();
  }

  /* 「我的教材」：現在存在瀏覽器；日後換成曼米平台的雲端教材庫，只要換掉 Store 這四個函式 */
  var LIB_KEY = "mandamy-zhuyin-library";
  var Store = {
    list: function(){ try { return JSON.parse(localStorage.getItem(LIB_KEY) || "[]"); } catch(e){ return []; } },
    _put: function(a){ localStorage.setItem(LIB_KEY, JSON.stringify(a)); },
    get: function(id){ return Store.list().filter(function(x){ return x.id === id; })[0]; },
    save: function(doc){
      var a = Store.list(), i = a.findIndex(function(x){ return x.id === doc.id; });
      if(i >= 0) a[i] = doc; else a.unshift(doc);
      Store._put(a);
    },
    remove: function(id){ Store._put(Store.list().filter(function(x){ return x.id !== id; })); }
  };
  function saveDoc(asNew){
    var d = snapshot();
    if(!d.title.trim() && !d.text.trim()){ toast("內容是空的，沒有儲存"); return; }
    if(asNew || !docId) docId = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    d.id = docId; d.updated = Date.now();
    if(!d.title.trim()) d.title = Array.from(d.text.replace(/\s+/g," ")).slice(0,12).join("") + "…";
    try { Store.save(d); toast("已儲存到「我的教材」"); } catch(e){ toast("儲存失敗（瀏覽器空間不足？）"); }
    renderLib();
  }
  function fmt(t){ var d = new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
  function renderLib(){
    var box = $("libList"), a = Store.list();
    box.innerHTML = a.length ? "" : '<p class="hint">還沒有儲存的教材。</p>';
    a.forEach(function(d){
      var row = document.createElement("div"); row.className = "lib-row";
      row.innerHTML = '<div class="t"><b>'+esc(d.title || "未命名")+(d.id === docId ? "　（編輯中）" : "")+'</b><small>'+fmt(d.updated)+' · '+Array.from(d.text||"").length+' 字</small></div>';
      [["開啟", function(){ docId = d.id; loadSnapshot(d); $("libDlg").close(); }],
       ["複製", function(){ var c = JSON.parse(JSON.stringify(d)); c.id = "d"+Date.now().toString(36); c.title += "（副本）"; c.updated = Date.now(); Store.save(c); renderLib(); }],
       ["刪除", function(){ if(confirm("刪除「"+(d.title||"未命名")+"」？")){ Store.remove(d.id); if(docId === d.id) docId = null; renderLib(); } }]
      ].forEach(function(x){ var b = document.createElement("button"); b.className = "btn"; b.textContent = x[0]; b.onclick = x[1]; row.appendChild(b); });
      box.appendChild(row);
    });
  }
  $("btnLib").onclick = function(){ renderLib(); $("libDlg").showModal(); };
  $("libClose").onclick = function(){ $("libDlg").close(); };
  $("libSave").onclick = function(){ saveDoc(false); };
  $("libSaveAs").onclick = function(){ saveDoc(true); };
  $("libNew").onclick = function(){ docId = null; overrides = {}; loadSnapshot({ title:"", text:"", S:S, fs:+$("fs").value }); $("libDlg").close(); };
  $("libExport").onclick = function(){
    var blob = new Blob([JSON.stringify({ app:"mandamy-zhuyin", docs:Store.list() }, null, 1)], { type:"application/json" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "曼米注音教材備份.json"; a.click();
  };
  $("libImport").onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    f.text().then(function(t){
      var j = JSON.parse(t), n = 0;
      (j.docs || []).forEach(function(d){ if(d && d.id && typeof d.text === "string"){ Store.save(d); n++; } });
      renderLib(); toast("已匯入 " + n + " 份教材");
    }).catch(function(){ toast("這不是有效的備份檔"); });
    e.target.value = "";
  };

  /* ---------- 學生連結 ---------- */
  function b64u(u8){ var s = ""; for(var i=0;i<u8.length;i+=8192) s += String.fromCharCode.apply(null, u8.subarray(i, i+8192)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  function unb64u(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "="; var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
  function pipe(bytes, Stream, kind){
    return new Response(new Blob([bytes]).stream().pipeThrough(new Stream(kind))).arrayBuffer().then(function(b){ return new Uint8Array(b); });
  }
  function pack(obj){
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if(window.CompressionStream) return pipe(bytes, CompressionStream, "deflate-raw").then(function(u){ return "z" + b64u(u); });
    return Promise.resolve("j" + b64u(bytes));
  }
  function unpack(str){
    var bytes = unb64u(str.slice(1));
    var p = str[0] === "z" ? pipe(bytes, DecompressionStream, "deflate-raw") : Promise.resolve(bytes);
    return p.then(function(u){ return JSON.parse(new TextDecoder().decode(u)); });
  }
  function studentUrl(){
    var d = snapshot();
    return pack({ title:d.title, text:d.text, S:d.S, fs:d.fs, overrides:d.overrides }).then(function(code){
      return location.origin + location.pathname + "#s=" + code;
    });
  }
  function warnMode(){ if(S.mode !== "ch" && S.mode !== "zy"){ toast("提醒：目前是「" + (S.mode === "trace" ? "描寫" : "完整") + "」，學生沒有欄位可填；要作答請選「隱國字」或「隱注音」"); return true; } return false; }
  $("btnLink").onclick = function(){
    studentUrl().then(function(u){
      (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function(){ if(!warnMode()) toast("學生連結已複製（" + u.length + " 字元）"); }, function(){ prompt("複製這個連結給學生：", u); });
    });
  };
  $("btnPreview").onclick = function(){ studentUrl().then(function(u){ window.open(u, "_blank"); }); warnMode(); };

  /* ---------- 學生作答 ---------- */
  function normZ(z){ z = String(z).replace(/[\sˉ]/g, ""); if(z.indexOf("˙") >= 0) z = "˙" + z.replace(/˙/g, ""); return z; }
  var lastResult = "";
  function checkAnswers(){
    var all = document.querySelectorAll(".ans"), ok = 0, wrong = [];
    all.forEach(function(el){
      var good = el.classList.contains("zin") ? normZ(el.value) === normZ(el.dataset.a) : el.value.trim() === el.dataset.a;
      el.classList.toggle("ok", good); el.classList.toggle("bad", !good && el.value.trim() !== "");
      if(good) ok++; else wrong.push(el.dataset.a);
    });
    var name = $("stuName").value.trim() || "（未填姓名）";
    $("score").textContent = "答對 " + ok + " / " + all.length;
    lastResult = name + "　《" + ($("title").value || "注音練習") + "》　" + ok + " / " + all.length + (wrong.length ? "　答錯或未答：" + wrong.join("、") : "　全對！");
  }
  $("btnCheck").onclick = checkAnswers;
  $("btnReset").onclick = function(){ document.querySelectorAll(".ans").forEach(function(el){ el.value = ""; el.classList.remove("ok","bad"); }); $("score").textContent = ""; lastResult = ""; };
  $("btnCopyScore").onclick = function(){
    checkAnswers();
    (navigator.clipboard ? navigator.clipboard.writeText(lastResult) : Promise.reject()).then(function(){ toast("成績已複製，可以貼給老師"); }, function(){ prompt("複製成績：", lastResult); });
  };

  /* ---------- 暫存（存在這台瀏覽器） ---------- */
  var KEY = "mandamy-zhuyin-draft";
  function persist(){ try { var d = snapshot(); d.docId = docId; localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} }

  function boot(){
    var m = /[#&]s=([^&]+)/.exec(location.hash);
    if(m){
      STUDENT = true; document.body.classList.add("student");
      unpack(decodeURIComponent(m[1])).then(function(d){
        loadSnapshot(d);
        document.title = (d.title || "注音練習") + " · 曼米中文";
        $("title").value = d.title || "";
      }).catch(function(){ $("pages").innerHTML = '<p style="text-align:center;padding:40px">這個連結無法開啟，請向老師再要一次連結。</p>'; });
      return;
    }
    try {
      var saved = JSON.parse(localStorage.getItem(KEY) || "null");
      if(saved){ docId = saved.docId || null; loadSnapshot(saved); }
    } catch(e){}
    if(!$("text").value) $("btnSample").click(); else { applyView(); render(); }
  }
  boot();
})();
</script>
</body>
</html>
